name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the patch-coverage gate below diffs against origin/main, which
          # needs a real merge base. The default shallow clone doesn't have one.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        working-directory: server
        # Base + dev only. requirements-ml.txt (torch, SAM2, LaMa, ESRGAN) is deliberately
        # skipped: app/ml.py loads every model lazily and falls back to the classical
        # implementations, and the tests assert on whichever backend answered. Pulling
        # ~3 GB of CUDA wheels to reach the same assertions is not worth it.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest-cov diff-cover

      - name: Run tests with coverage
        working-directory: server
        run: pytest tests --cov --cov-report=xml --cov-report=term

      - name: Patch coverage gate
        # THE merge gate: every line this PR adds or changes under server/app must be
        # ≥80% covered. Runs locally off coverage.xml, so it blocks a merge with no
        # third-party service in the loop — Codecov below is reporting on top of it.
        #
        # Must run from server/: coverage.xml's paths are relative to server/app (see
        # server/.coveragerc), and diff-cover resolves them against the working
        # directory. From the repo root it silently matches nothing and always passes.
        if: github.event_name == 'pull_request'
        working-directory: server
        run: |
          git fetch --no-tags --depth=0 origin main:refs/remotes/origin/main || git fetch --no-tags origin main
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under=80 \
            --markdown-report=patch-coverage.md
          cat patch-coverage.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        # CODECOV_TOKEN is set (see README) — blocking now. codecov/patch and
        # codecov/project post as separate PR statuses and are required checks on the
        # ruleset alongside the diff-cover step above, which stays as the fast local gate.
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server/coverage.xml
          flags: server
          fail_ci_if_error: true

  client:
    name: client typecheck + lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Typecheck and build
        working-directory: client
        run: npm run build
